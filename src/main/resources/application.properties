


# Database
app.db.dbuser=${MYSQLUSER:root}
app.db.dbpassword=${MYSQLPASSWORD:}
app.db.url=${MYSQLHOST:localhost}:${MYSQLPORT:3306}
app.db.dbname=${MYSQLDATABASE:mydb}

# Server
app.server.timezone=Asia/Karachi

# Spring Datasource
spring.datasource.username=${app.db.dbuser}
spring.datasource.password=${app.db.dbpassword}
spring.datasource.url=jdbc:mysql://${app.db.url}/${app.db.dbname}?createDatabaseIfNotExist=true&serverTimezone=${app.server.timezone}&useLegacyDatetimeCode=false&useUnicode=yes&characterEncoding=UTF-8&characterSetResults=UTF-8

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
file.upload-dir=uploads/profile-pictures

# Password Reset
app.password-reset-token-expiry-minutes=15

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=1000000
app.jwt.refresh-token-expiration-ms=10000000

# Fee
fee.default-rate-per-credit-hour=5000
fee.default-fixed-semester-charge=15000

# Railway Port
server.port=${PORT:8080}

brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}